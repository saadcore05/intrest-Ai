<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow"> <!-- keeps the surprise out of search results -->
  <title>Sirf Madam ke liye</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ SECTION 1: THE LOCK ============ -->
  <main id="lock" class="screen" aria-labelledby="lock-title">
    <div class="lock-wrap">

      <!-- Flat vector padlock. Shackle lifts on the right answer (see script.js) -->
      <svg class="padlock" id="padlock" viewBox="0 0 120 150" role="img" aria-label="Band taala">
        <rect class="pl-shadow" x="24" y="72" width="88" height="70" rx="10"/>
        <path class="pl-shackle" d="M32 70 V48 a28 28 0 0 1 56 0 V70"/>
        <rect class="pl-body" x="16" y="64" width="88" height="70" rx="10"/>
        <circle class="pl-key" cx="60" cy="92" r="9"/>
        <rect class="pl-key" x="56" y="96" width="8" height="20" rx="2"/>
      </svg>

      <h1 id="lock-title">Madam Prime Minister ka daftar.</h1>
      <p class="lead">Andar jaane se pehle ek sawal.</p>

      <form id="lock-form" autocomplete="off" novalidate>
        <!-- Question text script.js ke CONFIG.QUESTION se set hota hai -->
        <label for="lock-input" id="lock-question">Saad tumhe kin kin naamon se bulata hai? (Koi ek likh do)</label>
        <div class="field-row">
          <input id="lock-input" type="text" inputmode="text" autocapitalize="off" spellcheck="false" placeholder="Jawab yahan likho">
          <button type="submit" class="btn btn-pink">Kholo</button>
        </div>
        <p id="lock-msg" class="msg" role="alert"></p>
      </form>

    </div>
  </main>

  <!-- ============ SECTION 2: THE ROAST BOT ============ -->
  <section id="bot" class="screen" aria-labelledby="bot-title" hidden>
    <div class="bot-wrap">

      <header class="bot-head">
        <span class="bot-avatar" aria-hidden="true">
          <svg viewBox="0 0 40 40"><rect x="6" y="10" width="28" height="22" rx="6"/><circle cx="15" cy="21" r="3"/><circle cx="25" cy="21" r="3"/><rect x="18" y="3" width="4" height="7"/></svg>
        </span>
        <div>
          <h2 id="bot-title">Roast Bot</h2>
          <p class="bot-sub">Koi bhi sawal poochho. Jawab ki guarantee nahi.</p>
        </div>
      </header>

      <div id="chat" class="chat" role="log" aria-live="polite"></div>

      <div class="bot-foot">
        <button id="next-btn" class="btn btn-blue" type="button" hidden>Aage chalo</button>
        <form id="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Bot se kuch poochho..." aria-label="Bot se sawal">
          <button type="submit" class="btn btn-pink" id="send-btn">Bhejo</button>
        </form>
      </div>

    </div>
  </section>

  <!-- ============ SECTION 3: THE WISH ============ -->
  <section id="wish" class="screen" aria-labelledby="wish-title" hidden>
    <div class="wish-wrap">

      <h2 id="wish-title">Happy Birthday!</h2>
      <p id="wish-text" class="wish-text"></p>

      <!-- The iframe src is filled by script.js from CONFIG.YOUTUBE_ID -->
      <div class="video-frame" id="video-frame">
        <iframe id="video" title="Birthday video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <p id="wish-sign" class="wish-sign"></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
